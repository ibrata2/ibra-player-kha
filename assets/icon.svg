<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="35%" cy="25%" r="85%">
      <stop offset="0" stop-color="#2a1216"/><stop offset="1" stop-color="#070304"/>
    </radialGradient>
    <linearGradient id="note" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset="1" stop-color="#c9ccd4" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ff4a5c"/><stop offset=".55" stop-color="#e3192b"/><stop offset="1" stop-color="#8e0614"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b80c1d"/><stop offset="1" stop-color="#5c020b"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#ff2a3f" stroke-opacity=".35" stroke-width="4"/>
  <!-- music note behind -->
  <g fill="url(#note)">
    <path d="M318 58 L452 30 L452 70 L338 94 Z"/>
    <rect x="318" y="58" width="20" height="196"/>
    <rect x="432" y="30" width="20" height="196"/>
    <ellipse cx="300" cy="256" rx="42" ry="31" transform="rotate(-20 300 256)"/>
    <ellipse cx="414" cy="228" rx="42" ry="31" transform="rotate(-20 414 228)"/>
  </g>
  <!-- bird -->
  <g transform="translate(-14 34)">
    <!-- tail -->
    <path d="M156 316 C120 330 84 356 54 396 C92 384 120 372 150 350 Z" fill="url(#wing)"/><path d="M152 300 C110 300 74 312 40 336 C82 340 118 336 154 326 Z" fill="#a50a19"/>
    <!-- body -->
    <path d="M140 300 C140 220 200 168 268 176 C300 150 352 160 362 206 C372 252 352 300 316 334 C276 372 206 384 168 360 C150 348 140 326 140 300 Z" fill="url(#body)"/>
    <!-- belly highlight -->
    <path d="M200 330 C240 350 300 336 330 300 C310 352 240 372 196 352 Z" fill="#ff8a95" opacity=".55"/>
    <!-- wing -->
    <path d="M178 262 C214 236 270 240 300 268 C276 310 222 330 160 318 C150 296 158 276 178 262 Z" fill="url(#wing)"/>
    <path d="M188 286 C214 278 246 280 270 290 M184 302 C208 298 234 300 254 306" stroke="#ff5a6a" stroke-width="5" stroke-linecap="round" fill="none" opacity=".7"/>
    <!-- crest -->
    <path d="M300 182 C302 150 318 128 340 120 C330 140 332 156 338 170 C348 150 366 142 382 144 C366 160 360 178 352 196 Z" fill="url(#body)"/>
    <!-- beak (singing, open) -->
    <path d="M356 206 L410 196 L362 222 Z" fill="#ffb02e"/>
    <path d="M360 226 L404 236 L356 238 Z" fill="#e08a12"/>
    <!-- eye -->
    <circle cx="328" cy="208" r="13" fill="#fff"/>
    <circle cx="331" cy="208" r="8" fill="#111"/>
    <circle cx="334" cy="204" r="3" fill="#fff"/>
    <!-- sheen -->
    <path d="M160 268 C170 214 220 182 268 186 C230 200 196 230 182 272 Z" fill="url(#sheen)"/>
    <!-- feet -->
    <path d="M228 372 L222 404 M252 370 L250 404" stroke="#ffb02e" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
