name: Build Ibra Player Kha
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APKs
        id: build
        run: |
          set +e
          gradle assembleRelease --no-daemon > build.log 2>&1
          code=$?
          tail -60 build.log
          if [ $code -ne 0 ]; then
            grep -E "error:|e: |FAILURE|What went wrong|Could not|> " build.log | head -40 | sed 's/^/::error::/'
            exit 1
          fi
          ver=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          mkdir -p out
          ls -la app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "out/Ibra Player Kha ${ver} arm64.apk"
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "out/Ibra Player Kha ${ver} armv7.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: emulator-apk
          path: app/build/outputs/apk/release/app-x86_64-release.apk
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: ibra-player-kha-android
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

  smoke-test:
    name: Start-up test on an Android 15 emulator
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: emulator-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r -g app-x86_64-release.apk
            mkdir -p shots
            adb logcat -c
            adb shell am start -n com.ibrata2.playerkha/com.ibrata2.player.MainActivity
            sleep 12
            adb exec-out screencap -p > shots/1-start.png
            adb shell input keyevent KEYCODE_BACK || true
            sleep 2
            adb shell am start -n com.ibrata2.playerkha/com.ibrata2.player.MainActivity
            sleep 4
            adb shell am start -a android.intent.action.SEND -t text/plain --es android.intent.extra.TEXT "https://youtu.be/jNQXAC9IVRw" -n com.ibrata2.playerkha/com.ibrata2.player.MainActivity
            sleep 25
            adb exec-out screencap -p > shots/2-downloads.png
            adb shell input swipe 500 1500 500 400 300
            sleep 2
            adb exec-out screencap -p > shots/3-downloads-scrolled.png
            python3 -c "import wave,struct,math; w=wave.open('t.wav','wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(8000); w.writeframes(b''.join(struct.pack('<h',int(8000*math.sin(i/9))) for i in range(80000))); w.close()"
            adb push t.wav "/sdcard/Music/Test song.wav"
            adb shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d "file:///sdcard/Music/Test%20song.wav" || true
            adb shell appops set com.ibrata2.playerkha MANAGE_EXTERNAL_STORAGE allow || true
            sleep 4
            adb shell am start -n com.ibrata2.playerkha/com.ibrata2.player.MainActivity --es tab music
            sleep 3
            adb shell input tap 27 52
            sleep 4
            adb exec-out screencap -p > shots/5-music.png
            adb shell input tap 40 121
            sleep 2
            adb exec-out screencap -p > shots/6-item-menu.png
            adb shell input keyevent KEYCODE_BACK
            sleep 1
            adb shell input swipe 180 121 180 121 1200
            sleep 2
            adb exec-out screencap -p > shots/6b-longpress.png
            adb shell input tap 230 365
            sleep 2
            adb shell input text "Renamed"
            sleep 1
            adb exec-out screencap -p > shots/8-rename-dialog.png
            adb shell input tap 251 255
            sleep 1
            adb exec-out screencap -p > shots/8b-after-ok.png
            sleep 2
            adb shell input keyevent KEYCODE_BACK
            sleep 2
            adb exec-out screencap -p > shots/9-renamed.png
            adb shell ls -la /sdcard/Music/ > shots/files-after-rename.txt
            adb shell input tap 40 121
            sleep 2
            adb shell input tap 230 460
            sleep 2
            adb exec-out screencap -p > shots/10-delete-confirm.png
            adb shell input keyevent KEYCODE_BACK
            adb shell am start -n com.ibrata2.playerkha/com.ibrata2.player.MainActivity --es tab playlists
            sleep 3
            adb exec-out screencap -p > shots/7-playlists.png
            adb shell monkey -p com.ibrata2.playerkha --pct-syskeys 0 --throttle 150 -s 42 400 || true
            sleep 3
            adb exec-out screencap -p > shots/4-after-monkey.png
            adb logcat -d > shots/logcat.txt
            grep -n -A40 "FATAL EXCEPTION" shots/logcat.txt > shots/crash.txt || true
            grep -n -B2 -A30 "ANR in com.ibrata2" shots/logcat.txt >> shots/crash.txt || true
            echo "===== CRASHES ====="; cat shots/crash.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test
          path: shots/
      - name: Save screenshots to the ci-shots branch
        if: always()
        run: |
          cd shots
          git init -q -b ci-shots
          git add *.png crash.txt 2>/dev/null || true
          git -c user.name=ci -c user.email=ci@local commit -qm "screens ${{ github.sha }}" || exit 0
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-shots
      - name: Fail if the app crashed
        run: |
          if [ -s shots/crash.txt ]; then
            head -60 shots/crash.txt | sed 's/^/::error::/'
            exit 1
          fi

  release:
    name: Publish release
    needs: [android, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ibra-player-kha-android
          path: out
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.android.outputs.version }}
          name: Ibra Player Kha ${{ needs.android.outputs.version }}
          make_latest: true
          files: out/*.apk
          body: |
            **Ibra Player Kha ${{ needs.android.outputs.version }}** — مشغّل صوت وفيديو بدون إعلانات + تحميل من يوتيوب (صوت أو فيديو بالدقة اللي تريدها).

            أي ملف أنزّل؟
            - **arm64** ← أغلب الموبايلات الحديثة (من 2017 وطالع).
            - **armv7** ← الموبايلات القديمة.

            برمجة وتطوير ابراهيم الخزرجي — https://ibraprogram.netlify.app/
