name: Build Ibra Player Kha
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APKs
        id: build
        run: |
          set +e
          gradle assembleRelease --no-daemon > build.log 2>&1
          code=$?
          tail -60 build.log
          if [ $code -ne 0 ]; then
            grep -E "error:|e: |FAILURE|What went wrong|Could not|> " build.log | head -40 | sed 's/^/::error::/'
            exit 1
          fi
          ver=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          mkdir -p out
          ls -la app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "out/Ibra Player Kha ${ver} arm64.apk"
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "out/Ibra Player Kha ${ver} armv7.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ibra-player-kha-android
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build.outputs.version }}
          name: Ibra Player Kha ${{ steps.build.outputs.version }}
          make_latest: true
          files: out/*.apk
          body: |
            **Ibra Player Kha ${{ steps.build.outputs.version }}** — مشغّل صوت وفيديو بدون إعلانات + تحميل من يوتيوب (صوت أو فيديو بالدقة اللي تريدها).

            أي ملف أنزّل؟
            - **arm64** ← أغلب الموبايلات الحديثة (من 2017 وطالع).
            - **armv7** ← الموبايلات القديمة.

            برمجة وتطوير ابراهيم الخزرجي — https://ibraprogram.netlify.app/
